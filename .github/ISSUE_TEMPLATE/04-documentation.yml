name: Documentation
description: Report a documentation problem or suggest a documentation improvement.
title: "[Docs]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        ## Documentation

        Documentation is an important part of the project.

        Thank you for helping make the project easier to understand, use, and contribute to.

  - type: input
    id: location
    attributes:
      label: Documentation Location
      description: Where is the documentation that needs attention?
      placeholder: "Example: README.md, docs/getting-started.md, API reference"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Documentation Issue
      description: What kind of documentation change is needed?
      options:
        - Incorrect information
        - Missing information
        - Unclear explanation
        - Typo or grammar
        - Outdated information
        - Improvement or restructuring
        - Other
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: Current Content
      description: Explain what is currently documented or what is missing.
      placeholder: Describe the current documentation.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed Change
      description: Describe what should be changed or added.
      placeholder: Explain how the documentation could be improved.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add examples, references, screenshots, or other useful information.
      placeholder: Additional information.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Issues for a similar documentation request.
          required: true
        - label: I have provided the location or context of the documentation.
          required: true
