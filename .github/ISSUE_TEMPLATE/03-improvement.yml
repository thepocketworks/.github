name: Improvement
description: Suggest an improvement to an existing feature, workflow, or project component.
title: "[Improvement]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## Before You Start

        Thank you for helping improve the project.

        Please search existing Issues and Discussions before submitting a new proposal.

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: Describe how the project currently behaves.
      placeholder: Explain the current behavior or workflow.
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed Improvement
      description: Describe what could be improved.
      placeholder: Explain the improvement you would like to see.
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: Explain how this change would improve the project or developer experience.
      placeholder: |
        How would this make the project:
        - simpler?
        - smoother?
        - more productive?
        - more robust?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe other approaches or workarounds you have considered.
      placeholder: Describe alternative approaches.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any additional information that may help evaluate the proposal.
      placeholder: Examples, screenshots, benchmarks, references, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Issues and Discussions for similar proposals.
          required: true
        - label: This proposal is focused on improving an existing part of the project.
          required: true
