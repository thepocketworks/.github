name: Feature Request
description: Suggest a new feature or user-facing capability.
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        ## Before You Start

        Thank you for taking the time to suggest an improvement.

        Please search existing Issues and Discussions before submitting a new request. The idea may already have been proposed or discussed.

        For significant changes, consider discussing the idea before starting implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: Describe the problem or limitation you are experiencing.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you would like to see.
      placeholder: Explain how you think the problem could be solved.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative solutions or workarounds you have considered.
      placeholder: What alternatives or workarounds have you tried?
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain how this feature would be used in practice.
      placeholder: Describe a concrete example of how this would help.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other information that may help evaluate the proposal.
      placeholder: Examples, screenshots, references, related Issues, etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing Issues and Discussions for similar requests.
          required: true
        - label: This request is focused on a specific problem or capability.
          required: true
        - label: I understand that this feature may not be accepted if it does not fit the project's direction.
          required: true
